{% extends 'base.html' %}

{% block title %}编辑评论{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <!-- 侧边栏导航 -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5>个人空间</h5>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <a href="{% url 'profile' %}" class="text-dark text-decoration-none">首页</a>
                    </li>
                    <li class="list-group-item active">
                        <a href="{% url 'user_comments' %}" class="text-white text-decoration-none">评论管理</a>
                    </li>
                    <li class="list-group-item">
                        <a href="{% url 'user_collections' %}" class="text-dark text-decoration-none">收藏管理</a>
                    </li>
                </ul>
            </div>
        </div>
        
        <div class="col-md-9">
            <!-- 编辑评论内容 -->
            <div class="card">
                <div class="card-header">
                    <h5>编辑评论</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'edit_comment' comment.id %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="comment-content" class="form-label">评论内容</label>
                            <textarea class="form-control" id="comment-content" name="content" rows="5" required>{{ comment.content }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'user_comments' %}" class="btn btn-secondary">取消</a>
                            <button type="submit" class="btn btn-primary">保存修改</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
